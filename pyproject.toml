[project]
name = "cortexlab"
version = "0.1.0"
description = "Interactive 3D observatory for recorded real PyTorch transformer tensors"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["torch==2.6.0", "fastapi==0.115.12", "pydantic==2.11.4", "uvicorn==0.34.2", "psutil==7.2.2"]

[project.optional-dependencies]
test = ["pytest==9.0.3", "httpx==0.28.1", "numpy==2.2.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
